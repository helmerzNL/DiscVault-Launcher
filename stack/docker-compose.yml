services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (see .env.example)}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Resolved inside the container, not by Compose on the host, so a missing
      # host-side variable cannot turn this into an invalid command that fails
      # forever. Probing TCP instead of the Unix socket keeps the check false
      # during initdb, when a temporary socket-only server is briefly running.
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"'
      interval: 10s
      timeout: 5s
      retries: 10
      # First start runs initdb and can be slow on NAS storage. Without this,
      # early failures mark the container unhealthy and abort the whole `up`.
      start_period: 120s
    networks:
      - discvault

  next-api:
    image: ${DISCVAULT_IMAGE:-ghcr.io/helmerznl/discvault:beta}
    restart: unless-stopped
    working_dir: /opt/discvault/backend
    command:
      [
        "sh",
        "-c",
        "python next_database.py migrate && exec gunicorn --bind 0.0.0.0:5000 --workers ${DISCVAULT_NEXT_API_WORKERS:-2} --timeout ${DISCVAULT_NEXT_API_TIMEOUT:-180} next_app:app"
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      DISCVAULT_LEGACY_DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DISCVAULT_NEXT_KEY_ENCRYPTION_KEY: ${DISCVAULT_NEXT_KEY_ENCRYPTION_KEY:-}
      RP_ID: ${RP_ID:-localhost}
      RP_NAME: ${RP_NAME:-DiscVault}
      RP_ORIGINS: ${RP_ORIGINS:-http://localhost:6180}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-false}
      DISCVAULT_UPDATE_CHANNEL: ${DISCVAULT_UPDATE_CHANNEL:-auto}
      DISCVAULT_NEXT_ENABLE_TEST_RESET: ${DISCVAULT_NEXT_ENABLE_TEST_RESET:-false}
      DISCVAULT_ADMIN_DEDUP_EXECUTE_ENABLED: ${DISCVAULT_ADMIN_DEDUP_EXECUTE_ENABLED:-false}
    volumes:
      - ${DISCVAULT_DATA_DIR:-./data}:/data
    ports:
      - "${DISCVAULT_WEB_PORT:-6180}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/next/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Runs pending migrations before Gunicorn binds. A first start on a fresh
      # database applies every migration, so keep this generous.
      start_period: 120s
    networks:
      - discvault

  next-worker:
    image: ${DISCVAULT_IMAGE:-ghcr.io/helmerznl/discvault:beta}
    restart: unless-stopped
    working_dir: /opt/discvault/backend
    command: ["python", "next_worker.py", "work"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-discvault_next}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-discvault_next}
      TZ: ${TZ:-Europe/Amsterdam}
      DISCVAULT_WORKER_ID: ${DISCVAULT_WORKER_ID:-next-worker-1}
      DISCVAULT_WORKER_POLL_INTERVAL: ${DISCVAULT_WORKER_POLL_INTERVAL:-2}
      DISCVAULT_LEGACY_DATA_DIR: /data
      # The worker validates the same runtime secrets as the API on startup and
      # must share the key-encryption secret with it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DISCVAULT_NEXT_KEY_ENCRYPTION_KEY: ${DISCVAULT_NEXT_KEY_ENCRYPTION_KEY:-}
    volumes:
      - ${DISCVAULT_DATA_DIR:-./data}:/data
    depends_on:
      next-api:
        condition: service_healthy
    # The worker has no listener to probe; without this it would report as
    # having no healthcheck at all rather than deliberately not having one.
    healthcheck:
      disable: true
    networks:
      - discvault

volumes:
  postgres-data:

networks:
  discvault:
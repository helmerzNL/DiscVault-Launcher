services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # The launcher always supplies these, so :? is a safety net rather than a
      # prompt: it fails loudly instead of letting an empty value reach postgres,
      # which otherwise crash-loops on "superuser password is not specified" and
      # only surfaces as an opaque "container is unhealthy".
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the launcher environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the launcher environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the launcher environment}
      TZ: ${TZ}
    volumes:
      - ${DISCVAULT_POSTGRES_DATA_DIR_HOST}:/var/lib/postgresql/data
    healthcheck:
      # Resolved inside the container, not by Compose on the host, so a missing
      # host-side variable cannot turn this into an invalid command that fails
      # forever. Probing TCP instead of the Unix socket keeps the check false
      # during initdb, when a temporary socket-only server is briefly running.
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}"'
      interval: 10s
      timeout: 5s
      retries: 10
      # First start runs initdb and can be slow on NAS storage. Without this,
      # early failures mark the container unhealthy and abort the whole `up`.
      start_period: 120s
    networks:
      - discvault-stack

  next-api:
    image: ${DISCVAULT_IMAGE}
    restart: unless-stopped
    working_dir: /opt/discvault/backend
    command:
      [
        "sh",
        "-c",
        "python next_database.py migrate && exec gunicorn --bind 0.0.0.0:5000 --workers ${DISCVAULT_NEXT_API_WORKERS} --timeout ${DISCVAULT_NEXT_API_TIMEOUT} next_app:app"
      ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TZ: ${TZ}
      DISCVAULT_LEGACY_DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the launcher environment}
      DISCVAULT_NEXT_KEY_ENCRYPTION_KEY: ${DISCVAULT_NEXT_KEY_ENCRYPTION_KEY:-}
      RP_ID: ${RP_ID}
      RP_NAME: ${RP_NAME}
      RP_ORIGINS: ${RP_ORIGINS}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-false}
      DISCVAULT_UPDATE_CHANNEL: ${DISCVAULT_UPDATE_CHANNEL:-auto}
      DISCVAULT_NEXT_ENABLE_TEST_RESET: ${DISCVAULT_NEXT_ENABLE_TEST_RESET}
      DISCVAULT_ADMIN_DEDUP_EXECUTE_ENABLED: ${DISCVAULT_ADMIN_DEDUP_EXECUTE_ENABLED:-false}
    volumes:
      - ${DISCVAULT_DATA_DIR_HOST}:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/next/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Runs pending migrations before Gunicorn binds. A first start on a fresh
      # database applies every migration, so keep this generous.
      start_period: 120s
    networks:
      - discvault-stack

  next-worker:
    image: ${DISCVAULT_IMAGE}
    restart: unless-stopped
    working_dir: /opt/discvault/backend
    command: ["python", "next_worker.py", "work"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TZ: ${TZ}
      DISCVAULT_WORKER_ID: ${DISCVAULT_WORKER_ID}
      DISCVAULT_WORKER_POLL_INTERVAL: ${DISCVAULT_WORKER_POLL_INTERVAL}
      DISCVAULT_LEGACY_DATA_DIR: /data
      # next_worker.main() calls validate_runtime_secrets() before it does
      # anything else, so the worker needs the same secrets as the API. It must
      # also share the key-encryption secret, or credentials encrypted by one
      # process cannot be decrypted by the other.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the launcher environment}
      DISCVAULT_NEXT_KEY_ENCRYPTION_KEY: ${DISCVAULT_NEXT_KEY_ENCRYPTION_KEY:-}
    volumes:
      - ${DISCVAULT_DATA_DIR_HOST}:/data
    depends_on:
      next-api:
        condition: service_healthy
    # The worker has no listener to probe; without this it would report as
    # having no healthcheck at all rather than deliberately not having one.
    healthcheck:
      disable: true
    networks:
      - discvault-stack

  next-mcp:
    image: ${DISCVAULT_IMAGE}
    restart: unless-stopped
    working_dir: /opt/discvault/mcp-server
    command:
      [
        "python",
        "server.py",
        "--http",
        "--host",
        "0.0.0.0",
        "--port",
        "6090"
      ]
    environment:
      DISCVAULT_API: http://next-api:5000
      DISCVAULT_MCP_VERSION: ${BUILD_VERSION}
      TZ: ${TZ}
__DISCVAULT_MCP_PORTS__
    depends_on:
      next-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6090/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - discvault-stack

networks:
  discvault-stack:
    external: true
    name: ${DISCVAULT_NETWORK}

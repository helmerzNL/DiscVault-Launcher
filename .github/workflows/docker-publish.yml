name: Build & Publish DiscVault Launcher

# Two launcher channels, both built from main:
#
#   discvault-launcher:latest  bakes  discvault:latest  (production)
#   discvault-launcher:beta    bakes  discvault:beta    (beta)
#
# The channel table lives in .github/channels.json so this workflow and
# stack-update-watch.yml cannot drift apart -- which is exactly how the launcher
# ended up with an orphaned :beta tag that nothing published.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to rebuild.
        required: false
        default: all
        type: choice
        options:
          - all
          - latest
          - beta
      stack_image:
        description: Override the DiscVault app image baked into the launcher. Requires a single channel.
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: helmerznl/discvault-launcher

jobs:
  # Reads the channel table once and hands it to the build matrix, so the build
  # job itself contains no channel-selection logic.
  channels:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select channels
        id: select
        env:
          REQUESTED: ${{ github.event.inputs.channel }}
          STACK_IMAGE_OVERRIDE: ${{ github.event.inputs.stack_image }}
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/select_channels.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo '### Channels to build'
            echo ''
            echo '```json'
            echo "$matrix" | python3 -m json.tool
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: channels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.channels.outputs.matrix) }}

    # Scoped per channel so the two matrix jobs never cancel each other.
    concurrency:
      group: launcher-${{ matrix.channel }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stack digest
        id: stack
        env:
          STACK_IMAGE: ${{ matrix.stack_image }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$STACK_IMAGE" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ -z "$digest" || "$digest" == "<nil>" ]]; then
            digest="unknown"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build tag list
        id: tags
        env:
          LAUNCHER_TAGS: ${{ matrix.tags }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            for tag in $LAUNCHER_TAGS; do
              echo "${REGISTRY}/${IMAGE_NAME}:${tag}"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=DiscVault Launcher
            org.opencontainers.image.description=Unraid Community Apps launcher for the DiscVault Docker stack.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            eu.discvault.launcher.channel=${{ matrix.channel }}
            eu.discvault.stack.image=${{ matrix.stack_image }}
            eu.discvault.stack.digest=${{ steps.stack.outputs.digest }}
          build-args: |
            DISCVAULT_STACK_IMAGE=${{ matrix.stack_image }}
            DISCVAULT_STACK_DIGEST=${{ steps.stack.outputs.digest }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=launcher-${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=launcher-${{ matrix.channel }}

      - name: Summary
        run: |
          {
            echo "### Launcher channel \`${{ matrix.channel }}\`"
            echo ""
            echo "- Stack image: \`${{ matrix.stack_image }}\`"
            echo "- Stack digest: \`${{ steps.stack.outputs.digest }}\`"
            echo "- Published tags: \`${{ matrix.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

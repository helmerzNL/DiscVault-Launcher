name: Stack Image Update Watch

# Unraid can only see updates for the launcher image it installed, not for the
# child Compose containers the launcher manages. This workflow republishes a
# launcher channel whenever the DiscVault image that channel tracks changes, so
# the update shows up in Community Apps.
#
# The channel table is .github/channels.json, shared with docker-publish.yml.
# It used to be a ladder matching github.event.schedule against four literal
# cron strings, with an else branch that silently fell through to v26-beta --
# editing a cron string broke the mapping with no error, and :beta was not
# covered at all.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to check.
        required: false
        default: all
        type: choice
        options:
          - all
          - latest
          - beta
      force:
        description: Build even when the stack digest has not changed.
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: helmerznl/discvault-launcher

jobs:
  channels:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select channels
        id: select
        env:
          REQUESTED: ${{ github.event.inputs.channel }}
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/select_channels.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish-on-stack-change:
    needs: channels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.channels.outputs.matrix) }}

    concurrency:
      group: stack-update-watch-${{ matrix.channel }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stack digest
        id: digest
        env:
          STACK_IMAGE: ${{ matrix.stack_image }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$STACK_IMAGE" --format '{{.Manifest.Digest}}')"
          if [[ -z "$digest" || "$digest" == "<nil>" ]]; then
            echo "Could not resolve manifest digest for $STACK_IMAGE" >&2
            exit 1
          fi
          short="${digest#sha256:}"
          echo "stack_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "stack_digest_short=${short:0:12}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: plan
        env:
          CHANNEL: ${{ matrix.channel }}
          LAUNCHER_TAGS: ${{ matrix.tags }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          STACK_IMAGE: ${{ matrix.stack_image }}
          STACK_DIGEST: ${{ steps.digest.outputs.stack_digest }}
          DIGEST_SHORT: ${{ steps.digest.outputs.stack_digest_short }}
        run: |
          set -euo pipefail
          # The digest tag is the marker: if it already exists, this exact stack
          # digest has been published for this channel and there is nothing to do.
          digest_tag="${REGISTRY}/${IMAGE_NAME}:${CHANNEL}-stack-${DIGEST_SHORT}"
          existing=false
          if docker buildx imagetools inspect "$digest_tag" >/dev/null 2>&1; then
            existing=true
          fi

          should_publish=false
          if [[ "$FORCE" == "true" || "$existing" != "true" ]]; then
            should_publish=true
          fi

          echo "digest_tag=$digest_tag" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for tag in $LAUNCHER_TAGS; do
              echo "${REGISTRY}/${IMAGE_NAME}:${tag}"
            done
            echo "$digest_tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Stack update watch: \`$CHANNEL\`"
            echo ""
            echo "- Stack image: \`$STACK_IMAGE\`"
            echo "- Current digest: \`$STACK_DIGEST\`"
            echo "- Launcher tags: \`$LAUNCHER_TAGS\`"
            echo "- Digest tag: \`$digest_tag\`"
            echo "- Already published: \`$existing\`"
            echo "- Publish: \`$should_publish\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push launcher
        if: steps.plan.outputs.should_publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.plan.outputs.tags }}
          labels: |
            org.opencontainers.image.title=DiscVault Launcher
            org.opencontainers.image.description=Unraid Community Apps launcher for the DiscVault Docker stack.
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            eu.discvault.launcher.channel=${{ matrix.channel }}
            eu.discvault.stack.image=${{ matrix.stack_image }}
            eu.discvault.stack.digest=${{ steps.digest.outputs.stack_digest }}
          build-args: |
            DISCVAULT_STACK_IMAGE=${{ matrix.stack_image }}
            DISCVAULT_STACK_DIGEST=${{ steps.digest.outputs.stack_digest }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=launcher-${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=launcher-${{ matrix.channel }}
